name: Feature request
description: Suggest an improvement, or propose a new challenge.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What is awkward, missing, or unclear today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: insight
    attributes:
      label: For a new challenge, what is the insight
      description: >
        Challenges here are built around one realisation rather than one tool.
        What should the solver notice? Do not include the flag.
